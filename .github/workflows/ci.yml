name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  backend-ai-quality:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      OPENAI_API_KEY: "demo"
      JWT_SECRET: "dev-jwt-secret"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r backend-ai/requirements-dev.txt

      - name: Compile backend-ai + eval
        run: |
          python -m compileall backend-ai/app eval

      - name: Run offline eval
        run: |
          PYTHONPATH=backend-ai python -m eval.run_eval

      - name: Run backend-ai tests
        run: |
          PYTHONPATH=backend-ai python -m pytest -q backend-ai/tests

      - name: Run redteam harness
        run: |
          PYTHONPATH=backend-ai python eval/run_redteam.py

  backend-api-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend-api/package-lock.json

      - name: Install deps
        run: |
          cd backend-api
          npm ci

      - name: Build
        run: |
          cd backend-api
          npm run build

      - name: Run backend-api tests
        run: |
          cd backend-api
          npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "No docker-compose.yml found."
          fi

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend-api/package-lock.json

      - name: Install backend-api deps
        run: |
          cd backend-api
          npm ci

      - name: Build backend-ai container
        run: |
          docker compose up -d --build backend-ai

      - name: Run backend-api tests
        run: make test-api

      - name: Run backend-ai tests
        run: make test-ai

  integration-smoke:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            set -a
            . .env
            set +a
          fi
          POSTGRES_USER="${POSTGRES_USER:-postgres}"
          POSTGRES_DB="${POSTGRES_DB:-nivoxai}"
          MAX_WAIT=180
          INTERVAL=2
          deadline=$((SECONDS + MAX_WAIT))

          fail_with_logs() {
            docker compose ps || true
            docker compose logs --no-color postgres backend-api backend-ai frontend || true
            exit 1
          }

          wait_postgres() {
            echo "Waiting for postgres..."
            while [ "$SECONDS" -lt "$deadline" ]; do
              state=$(docker inspect -f '{{.State.Status}}' nivoxai-postgres 2>/dev/null || true)
              if [ "$state" != "running" ]; then
                sleep "$INTERVAL"
                continue
              fi
              if docker exec nivoxai-postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                echo "Postgres is ready."
                return 0
              fi
              sleep "$INTERVAL"
            done
            echo "Postgres did not become ready in time."
            fail_with_logs
          }

          wait_http() {
            local name="$1"
            local url="$2"
            local container="${3:-}"
            echo "Waiting for $name at $url..."
            while [ "$SECONDS" -lt "$deadline" ]; do
              if curl -sf --max-time 3 "$url" >/dev/null; then
                echo "$name is ready."
                return 0
              fi
              sleep "$INTERVAL"
            done
            echo "$name did not become ready in time."
            if [ -n "$container" ]; then
              docker logs "$container" || true
            fi
            fail_with_logs
          }

          wait_postgres
          wait_http "backend-api" "http://localhost:4000/health" "nivoxai-backend-api"
          wait_http "backend-ai" "http://localhost:8000/health" "nivoxai-backend-ai"
          wait_http "frontend" "http://localhost:3000/demo" "nivoxai-frontend"

      - name: Run smoke checks
        run: |
          bash scripts/ci_smoke.sh

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
