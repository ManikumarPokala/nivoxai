name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  backend-ai-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install fastapi uvicorn scikit-learn numpy pandas pydantic pytest

      - name: Compile backend-ai
        run: |
          cd backend-ai
          python -m compileall app eval

      - name: Run offline eval
        run: |
          cd backend-ai
          PYTHONPATH=. python -m eval.run_eval

      - name: Run backend-ai tests
        run: |
          cd backend-ai
          python -m pytest -q

      - name: Run redteam harness
        run: |
          python eval/run_redteam.py

  backend-api-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend-api/package-lock.json

      - name: Install deps
        run: |
          cd backend-api
          npm ci

      - name: Build
        run: |
          cd backend-api
          npm run build

      - name: Run backend-api tests
        run: |
          cd backend-api
          npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "No docker-compose.yml found."
          fi

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend-api/package-lock.json

      - name: Install backend-api deps
        run: |
          cd backend-api
          npm ci

      - name: Build backend-ai container
        run: |
          docker compose up -d --build backend-ai

      - name: Run backend-api tests
        run: make test-api

      - name: Run backend-ai tests
        run: make test-ai

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Run smoke checks
        run: |
          scripts/ci_smoke.sh

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
