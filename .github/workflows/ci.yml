name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  backend-ai-quality:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      OPENAI_API_KEY: "demo"
      JWT_SECRET: "dev-jwt-secret"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install fastapi uvicorn scikit-learn numpy pandas pydantic pytest httpx

      - name: Compile backend-ai + eval
        run: |
          python -m compileall backend-ai/app eval

      - name: Run offline eval
        run: |
          PYTHONPATH=backend-ai python -m eval.run_eval

      - name: Run backend-ai tests
        run: |
          PYTHONPATH=backend-ai python -m pytest -q backend-ai/tests

      - name: Run redteam harness
        run: |
          PYTHONPATH=backend-ai python eval/run_redteam.py

  backend-api-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend-api/package-lock.json

      - name: Install deps
        run: |
          cd backend-api
          npm ci

      - name: Build
        run: |
          cd backend-api
          npm run build

      - name: Run backend-api tests
        run: |
          cd backend-api
          npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "No docker-compose.yml found."
          fi

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend-api/package-lock.json

      - name: Install backend-api deps
        run: |
          cd backend-api
          npm ci

      - name: Build backend-ai container
        run: |
          docker compose up -d --build backend-ai

      - name: Run backend-api tests
        run: make test-api

      - name: Run backend-ai tests
        run: make test-ai

  integration-smoke:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Wait for containers to be healthy
        run: |
          set -e
          services=("nivoxai-postgres" "nivoxai-backend-ai" "nivoxai-backend-api" "nivoxai-frontend")
          for svc in "${services[@]}"; do
            echo "Waiting for $svc to be healthy..."
            for i in {1..60}; do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "$svc is healthy."
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "$svc did not become healthy in time."
                docker ps
                docker logs "$svc" || true
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run smoke checks
        run: |
          bash scripts/ci_smoke.sh

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
